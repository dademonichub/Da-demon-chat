const app=initializeApp(firebaseConfig); const db=getFirestore(app);
window.db=db; window.fns={collection,addDoc,doc,setDoc,getDoc,getDocs,query,where,onSnapshot,orderBy,serverTimestamp};

<script>
let curUser=JSON.parse(localStorage.getItem('dd_user')||'null')||{name:'',id:'',email:'',username:'',phone:'',pass:'',about:'😁 Today in emoji...',photo:''};
let chats=JSON.parse(localStorage.getItem('dd_chats')||'[]');
let groups=JSON.parse(localStorage.getItem('dd_groups')||'[]');
let calls=JSON.parse(localStorage.getItem('dd_calls')||'[]');
let userLinks=JSON.parse(localStorage.getItem('dd_links')||'[]');
let selectedChat=null,filter='All',selectMode=false,selectedIds=new Set(),camStream=null,facing='environment',currentPhoto='',sendTargets=new Set();
let qrStream=null,qrScanning=false;
let inboxUnsub=null;

function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');if(id=='page-main')renderChats();if(id=='page-you')renderYou();if(id=='page-qr')updateQR();if(id=='page-profileEdit')renderProfileFields();}
function save(){localStorage.setItem('dd_chats',JSON.stringify(chats));localStorage.setItem('dd_groups',JSON.stringify(groups));localStorage.setItem('dd_calls',JSON.stringify(calls));localStorage.setItem('dd_user',JSON.stringify(curUser));localStorage.setItem('dd_links',JSON.stringify(userLinks));}
function init(){let saved=JSON.parse(localStorage.getItem('dd_user')||'null'); if(saved&&saved.id){curUser=saved; setTimeout(()=>{showPage('page-main');renderChats();renderYou();updateQR();startInboxListener();},800); return;} setTimeout(()=>{showPage('page-lang');buildLang();},800);}
function buildLang(){let langs=['English','Chinese 中文','Spanish','French','Arabic','Hindi','Yoruba','Igbo','Hausa','Pidgin'];let list=document.getElementById('langList');list.innerHTML='';langs.forEach(l=>{let d=document.createElement('div');d.className='row';d.innerHTML='<b>'+l+'</b><span>›</span>';d.onclick=()=>{curUser.lang=l;save();showPage('page-auth');};list.appendChild(d);});}
function filterLang(){let q=document.getElementById('langSearch').value.toLowerCase();document.querySelectorAll('#langList .row').forEach(r=>{r.style.display=r.innerText.toLowerCase().includes(q)?'flex':'none';});}

async function login(){
  let input=document.getElementById('authEmail').value.trim();
  let pass=document.getElementById('authPass').value.trim();
  let msg=document.getElementById('authMsg');
  if(!input||!pass){alert('Enter DD ID / Email / Username / Phone + Password');return;}
  msg.innerText='Checking...';
  try{
    let queries=[
      window.fns.query(window.fns.collection(window.db,'users'),window.fns.where('id','==',input.toUpperCase())),
      window.fns.query(window.fns.collection(window.db,'users'),window.fns.where('email','==',input.toLowerCase())),
      window.fns.query(window.fns.collection(window.db,'users'),window.fns.where('username','==',input.toLowerCase().replace('@',''))),
      window.fns.query(window.fns.collection(window.db,'users'),window.fns.where('phone','==',input))
    ];
    let snaps=await Promise.all(queries.map(q=>window.fns.getDocs(q)));
    let found=null; for(let s of snaps){ if(!s.empty){found=s.docs[0].data(); break;}}
    if(found){
      if(found.pass!==pass){msg.innerText='Wrong password'; alert('Wrong password'); return;}
      curUser=found; save(); showPage('page-main'); renderChats(); renderYou(); startInboxListener(); msg.innerText=''; return;
    }
    let newId=input.startsWith('DD-')?input.toUpperCase():'DD-'+Math.floor(10000+Math.random()*90000);
    let uname=input.includes('@')?input.split('@')[0].toLowerCase():input.replace(/[^a-z0-9]/gi,'').toLowerCase();
    let newUser={id:newId,email:input.includes('@')?input.toLowerCase():'',username:uname,phone:/^[0-9+]+$/.test(input)?input:'',name:uname||'User',pass:pass,about:'😁 Today in emoji...',photo:'',created:Date.now()};
    await window.fns.setDoc(window.fns.doc(window.db,'users',newId),newUser);
    curUser=newUser; save(); showPage('page-main'); renderChats(); renderYou(); startInboxListener(); alert('Account created ✅ Your DD ID: '+newId);
  }catch(e){msg.innerText=e.message; alert(e.message);}
}

// --- NEW FIX: INBOX LISTENER - AUTO ADD FRIEND WHEN MESSAGE COMES ---
function startInboxListener(){
  if(inboxUnsub) inboxUnsub();
  if(!curUser.id) return;
  let q=window.fns.query(window.fns.collection(window.db,'messages'), window.fns.where('receiver','==',curUser.id), window.fns.orderBy('time','desc'));
  inboxUnsub=window.fns.onSnapshot(q, async (snap)=>{
    for(let docSnap of snap.docs){
      let m=docSnap.data();
      let senderId=m.sender;
      if(!senderId||senderId===curUser.id) continue;
      if(!chats.find(c=>c.id===senderId)){
        try{
          let uSnap=await window.fns.getDoc(window.fns.doc(window.db,'users',senderId));
          let uName=uSnap.exists()?uSnap.data().name:senderId;
          chats.unshift({id:senderId,name:uName,msg:m.text,time:'now',avatar:uName[0],unread:1});
          save(); renderChats();
        }catch(e){
          chats.unshift({id:senderId,name:senderId,msg:m.text,time:'now',avatar:senderId[0],unread:1});
          save(); renderChats();
        }
      }else{
        let c=chats.find(c=>c.id===senderId);
        c.msg=m.text; c.time='now'; c.unread=(c.unread||0)+1;
        save(); renderChats();
      }
    }
  });
}

function logout(){if(confirm('Logout?')){localStorage.removeItem('dd_user');location.reload();}}
function recover(){alert('Login with same DD ID / Email / Username / Phone + old password');}
function updateQR(){let idEl=document.getElementById('qrId'); if(!idEl) return; idEl.innerText=curUser.id; document.getElementById('qrName').innerText=curUser.name; let img=document.getElementById('qrImg'); if(img){let data=encodeURIComponent('DDCHAT:'+curUser.id+':'+curUser.name); img.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+data;}}
function shareQR(){updateQR(); let t=`Add me on DDchat\n${curUser.name}\n${curUser.id}`; if(navigator.share){navigator.share({title:'DDchat',text:t});}else{alert(t);}}
async function openQRScanner(){showPage('page-qrScan'); let v=document.getElementById('qrVideo'); try{if(qrStream)qrStream.getTracks().forEach(t=>t.stop()); qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); v.srcObject=qrStream; await v.play(); qrScanning=true; scanLoop();}catch(e){}}
async function scanLoop(){let v=document.getElementById('qrVideo'); if(!qrScanning) return; if('BarcodeDetector' in window){try{let d=new BarcodeDetector({formats:['qr_code']}); let c=await d.detect(v); if(c.length>0){handleScannedQR(c[0].rawValue); return;}}catch(e){}} setTimeout(scanLoop,500);}
function handleScannedQR(raw){if(!qrScanning) return; qrScanning=false; if(qrStream){qrStream.getTracks().forEach(t=>t.stop()); qrStream=null;} if(!raw.startsWith('DDCHAT:')){alert('Invalid QR'); showPage('page-qr'); return;} let id=raw.split(':')[1]; window.fns.getDoc(window.fns.doc(window.db,'users',id)).then(s=>{if(!s.exists()){alert('No user '+id); showPage('page-qr'); return;} let u=s.data(); if(!chats.find(c=>c.id===u.id)){chats.push({id:u.id,name:u.name,msg:'Added via QR',time:'now',avatar:u.name[0]}); save();} renderChats(); showPage('page-main');});}

function renderChats(){let list=document.getElementById('chatList'); if(!list) return; let q=(document.getElementById('mainSearch')?.value||'').toLowerCase(); list.innerHTML=''; let vis=chats.filter(c=>!q||c.id.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)); if(vis.length==0){list.innerHTML='<div style="text-align:center;padding:80px 20px;color:#8696a0"><b>No chats yet</b><br><button onclick="newChat()" style="margin-top:12px;padding:10px 20px;border-radius:20px;background:#5f2ee0;color:#fff;border:none">Start new conversation</button></div>'; return;} vis.forEach(c=>{let r=document.createElement('div');r.className='chatRow'; r.innerHTML='<div class=avatar>'+(c.avatar||c.name[0])+'</div><div style=flex:1><div style=display:flex;justify-content:space-between><b>'+c.name+'</b><span style=font-size:11px;color:#8696a0>'+(c.time||'')+'</span></div><div style=display:flex;justify-content:space-between><span style=color:#8696a0;font-size:13px>'+c.msg+'</span>'+(c.unread?'<span class=badge>'+c.unread+'</span>':'')+'</div></div>'; r.onclick=()=>openChat(c); list.appendChild(r);});}
function newChat(){document.getElementById('sheetNewChat').style.display='block';renderNewChatList();}
function closeNewChat(){document.getElementById('sheetNewChat').style.display='none';}
function renderNewChatList(){let q=(document.getElementById('newChatSearch')?.value||'').toLowerCase(); let list=document.getElementById('newChatList'); list.innerHTML=''; let f=chats.filter(c=>!q||c.id.toLowerCase().includes(q)); f.forEach(c=>{let d=document.createElement('div');d.className='sheetItem';d.innerHTML='<div class=avatar>'+(c.avatar||c.name[0])+'</div><div><b>'+c.name+'</b><div style=font-size:12px;color:#8696a0>'+c.id+'</div></div>';d.onclick=()=>{closeNewChat();openChat(c);};list.appendChild(d);});}
async function promptNewContact(){let id=prompt('Enter friend DD ID:','DD-'); if(!id) return; id=id.toUpperCase().trim(); let snap=await window.fns.getDoc(window.fns.doc(window.db,'users',id)); if(!snap.exists()){alert('No user '+id); return;} let u=snap.data(); if(chats.find(c=>c.id===u.id)){alert('Already added'); return;} chats.push({id:u.id,name:u.name,msg:'Tap to chat',time:'now',avatar:u.name[0]}); save(); renderChats(); renderNewChatList();}
function setFilter(f,el){filter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderChats();}
function openChat(c){selectedChat=c; document.getElementById('cName').innerText=c.name; document.getElementById('cAvatar').innerText=c.avatar||c.name[0]; showPage('page-chat'); let box=document.getElementById('cMessages'); box.innerHTML=''; c.unread=0; save(); renderChats(); let chatId=[curUser.id,c.id].sort().join('_'); let q=window.fns.query(window.fns.collection(window.db,'messages'),window.fns.where('chatId','==',chatId),window.fns.orderBy('time')); window.fns.onSnapshot(q,snap=>{box.innerHTML=''; snap.forEach(d=>{let m=d.data(); let div=document.createElement('div'); div.style.cssText='margin:6px 0;padding:8px 12px;border-radius:16px;max-width:75%;font-size:14px;'+(m.sender===curUser.id?'background:#5f2ee0;margin-left:auto':'background:#1f2c34'); div.innerText=m.text; box.appendChild(div);}); box.scrollTop=box.scrollHeight;});}

// --- NEW FIX: SHOW YOUR OWN MESSAGE INSTANTLY ---
async function sendMsg(){
  let input=document.getElementById('msgInput');
  let txt=input.value.trim(); if(!txt||!selectedChat) return;
  let box=document.getElementById('cMessages');
  // show instantly
  let div=document.createElement('div'); div.style.cssText='margin:6px 0;padding:8px 12px;border-radius:16px;max-width:75%;background:#5f2ee0;margin-left:auto;font-size:14px'; div.innerText=txt; box.appendChild(div); box.scrollTop=box.scrollHeight;
  input.value=''; selectedChat.msg=txt; selectedChat.time='now'; save(); renderChats();
  let chatId=[curUser.id,selectedChat.id].sort().join('_');
  try{await window.fns.addDoc(window.fns.collection(window.db,'messages'),{chatId:chatId,text:txt,sender:curUser.id,receiver:selectedChat.id,time:Date.now(),timestamp:window.fns.serverTimestamp()});}catch(e){alert('Send failed: '+e.message);}
}

function handleProfilePhoto(inp){let f=inp.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{curUser.photo=e.target.result; save(); renderProfileFields(); window.fns.setDoc(window.fns.doc(window.db,'users',curUser.id),curUser);}; r.readAsDataURL(f);}
function removePhoto(){delete curUser.photo; save(); renderProfileFields(); closePhotoSheet();}
function editField(f){if(f=='name'){let v=prompt('Name:',curUser.name); if(v){curUser.name=v.trim(); save(); window.fns.setDoc(window.fns.doc(window.db,'users',curUser.id),curUser); renderProfileFields();}} else if(f=='ddid'){alert(curUser.id);} else if(f=='gmail'){let v=prompt('Gmail:',curUser.email); if(v!==null){curUser.email=v.trim().toLowerCase(); save(); window.fns.setDoc(window.fns.doc(window.db,'users',curUser.id),curUser); renderProfileFields();}} else if(f=='username'){let v=prompt('Username:',curUser.username); if(v!==null){curUser.username=v.replace('@','').trim().toLowerCase(); save(); window.fns.setDoc(window.fns.doc(window.db,'users',curUser.id),curUser); renderProfileFields();}} else if(f=='phone'){let v=prompt('Phone:',curUser.phone); if(v!==null){curUser.phone=v.trim(); save(); window.fns.setDoc(window.fns.doc(window.db,'users',curUser.id),curUser); renderProfileFields();}} else if(f=='links'){let t=prompt('Title:'); let u=prompt('URL https://'); if(t&&u){userLinks.push({title:t,url:u}); save();}}}
