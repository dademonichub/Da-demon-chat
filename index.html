<script>
// ... keep your same variables above ...
let curUser={name:'Da Demon Hub',id:'',phone:'',email:'',username:'',lang:'English',pass:'',about:'😁 Today in emoji...',photo:''};

async function login(){
  let input=document.getElementById('authEmail').value.trim();
  let pass=document.getElementById('authPass').value.trim();
  let phoneInput=document.getElementById('authPhone').value.trim();
  if(!input||!pass){alert('Enter ID/Email/Username/Phone + Password');return;}
  
  if(!window.db){alert('No internet');return;}
  
  // 1. Try find existing user by any field
  let found=null;
  let checks=[
    {field:'id',value:input.toUpperCase()},
    {field:'email',value:input.toLowerCase()},
    {field:'username',value:input.toLowerCase().replace('@','')},
    {field:'phone',value:phoneInput||input}
  ];
  
  for(let c of checks){
    if(!c.value) continue;
    try{
      let q=window.fns.query(window.fns.collection(window.db,'users'), window.fns.where(c.field,'==',c.value));
      let snap=await window.fns.getDocs(q);
      if(!snap.empty){ found=snap.docs[0].data(); break; }
    }catch(e){}
  }
  
  // 2. If found - check password and login
  if(found){
    if(found.pass!==pass){alert('Wrong password for '+found.id);return;}
    curUser={...curUser,...found};
    save(); renderProfileFields(); showPage('page-main'); renderChats();
    return;
  }
  
  // 3. If not found - CREATE new valid account
  let newId = input.startsWith('DD-') ? input.toUpperCase() : 'DD-'+Math.floor(10000+Math.random()*90000);
  let newUsername = input.includes('@') ? input.split('@')[0].toLowerCase() : input.replace('DD-','').toLowerCase();
  
  let newUser={
    id:newId,
    email: input.includes('@')? input.toLowerCase() : (curUser.email||''),
    username: newUsername,
    phone: phoneInput||'',
    name: newUsername||'New User',
    pass: pass,
    about:'😁 Today in emoji...',
    photo:'',
    created:Date.now()
  };
  
  await window.fns.setDoc(window.fns.doc(window.db,'users',newId), newUser);
  curUser={...curUser,...newUser};
  save(); renderProfileFields(); showPage('page-main'); renderChats();
  alert('Account created ✅\nYour DD ID: '+newId+'\nNow you can login with DD ID / Gmail / Username / Phone + Password');
}

  document.getElementById('pLinks').innerText=userLinks.length? userLinks.length+' links' : 'Add links';

}
